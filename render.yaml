services:
  - type: web
    name: listingtool-official-transport
    runtime: node
    plan: free
    rootDir: tools/release-relay
    buildCommand: node --test tests/*.test.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: ENABLE_SIGNED_FORWARDING
        value: "0"
